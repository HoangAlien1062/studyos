# ==============================================================================
# Docker Compose Orchestration for StudyOS Full-Stack Application
# Usage:
#   docker-compose up -d --build
# ==============================================================================

version: '3.8'

services:
  studyos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyos-app
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5173
      - AI_SERVER_PORT=5001
    volumes:
      # Persistent local storage backup if mounted
      - studyos-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  studyos-data:
    driver: local
